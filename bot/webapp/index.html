<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>Directorio Telegram</title>
<link rel="stylesheet" href="/app/style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header class="topbar">
  <div class="topbar__inner">
    <div class="topbar__brand">
      <svg class="icon icon--brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="topbar__title">Directorio</span>
    </div>
    <button class="icon-btn" id="themeToggle" aria-label="Cambiar tema">
      <svg class="icon" id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </div>
</header>

<!-- ============ SEARCH ============ -->
<div class="search-wrap">
  <div class="search">
    <svg class="icon icon--search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="searchInput" placeholder="Buscar grupos o canales..." autocomplete="off" spellcheck="false">
    <button class="search__clear hidden" id="searchClear" aria-label="Limpiar">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
</div>

<!-- ============ CHIPS DE FILTROS ============ -->
<div class="chips" id="chips">
  <button class="chip" data-filter="type">
    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
    <span id="chip-type">Tipo</span>
    <svg class="icon icon--chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>
  <button class="chip" data-filter="country">
    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <line x1="2" y1="12" x2="22" y2="12"/>
      <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
    </svg>
    <span id="chip-country">País</span>
    <svg class="icon icon--chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>
  <button class="chip" data-filter="category">
    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
    </svg>
    <span id="chip-category">Categoría</span>
    <svg class="icon icon--chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>
  <button class="chip" data-filter="members_range">
    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
      <circle cx="9" cy="7" r="4"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
    </svg>
    <span id="chip-members_range">Miembros</span>
    <svg class="icon icon--chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6 9 12 15 18 9"/>
    </svg>
  </button>
  <button class="chip chip--toggle" data-toggle="adult">
    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
      <line x1="12" y1="9" x2="12" y2="13"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
    <span>+18</span>
  </button>
</div>

<!-- ============ INFO BAR ============ -->
<div class="infobar" id="infobar">
  <span class="infobar__count" id="countInfo">Cargando...</span>
</div>

<!-- ============ LISTA ============ -->
<main class="list" id="list"></main>

<!-- ============ SKELETON LOADER ============ -->
<div class="skeleton-wrap hidden" id="skeleton">
  <div class="skeleton-card"></div>
  <div class="skeleton-card"></div>
  <div class="skeleton-card"></div>
</div>

<!-- ============ EMPTY STATE ============ -->
<div class="empty hidden" id="empty">
  <svg class="empty__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="11" cy="11" r="8"/>
    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    <line x1="8" y1="11" x2="14" y2="11"/>
  </svg>
  <p class="empty__title">Sin resultados</p>
  <p class="empty__desc">Prueba con otra búsqueda o cambia los filtros</p>
</div>

<!-- ============ INFINITE SCROLL SENTINEL ============ -->
<div id="sentinel" class="sentinel"></div>

<!-- ============ LOADING MORE ============ -->
<div class="load-more hidden" id="loadMore">
  <div class="spinner"></div>
  <span>Cargando más...</span>
</div>

<!-- ============ BOTTOM SHEET FILTROS ============ -->
<div class="sheet hidden" id="sheet">
  <div class="sheet__backdrop" id="sheetBackdrop"></div>
  <div class="sheet__panel">
    <div class="sheet__handle"></div>
    <div class="sheet__header">
      <h2 class="sheet__title" id="sheetTitle">Filtrar</h2>
      <button class="icon-btn" id="sheetClose" aria-label="Cerrar">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div class="toast hidden" id="toast"></div>

<script src="/app/app.js"></script>
</body>
</html>
